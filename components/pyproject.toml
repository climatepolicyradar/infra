[project]
name = "components"
version = "1.2.1"
description = "Reusable Pulumi components for Climate Policy Radar infrastructure"
requires-python = ">=3.12,<3.14"
dependencies = ["boto>=2.49.0", "pulumi>=3.213.0", "pulumi-aws>=7.16.0"]
authors = [
  { name = "Climate Policy Radar", email = "tech@climatepolicyradar.org" },
]
readme = "README.md"


[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "pytest-asyncio>=1.3.0",
  "typing-extensions>=4.12",
  # PrivateStaticSite's sign-in Lambda dependencies, for its tests;
  # keep in step with components/aws/private_static_site/auth/requirements.txt
  "cryptography==50.0.2",
  "pyjwt==2.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["components"]
